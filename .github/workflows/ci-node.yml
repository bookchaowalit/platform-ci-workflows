# Reusable Node.js CI: install, lint (Biome or ESLint), typecheck, Vitest/test, optional coverage gate, optional build.
#
# Caller example (public repo):
#   jobs:
#     web:
#       uses: bookchaowalit/platform-ci-workflows/.github/workflows/ci-node.yml@<sha> # v1.0.0
#       with:
#         working-directory: apps/web
#
# Private repos pass runner: '["self-hosted","linux","x64","railway"]'.
name: ci-node

on:
  workflow_call:
    inputs:
      runner:
        description: JSON runs-on value. '"ubuntu-24.04"' (pinned image) for public repos, '["self-hosted","linux","x64","railway"]' for private.
        type: string
        default: '"ubuntu-24.04"'
      working-directory:
        description: Directory that holds package.json.
        type: string
        default: "."
      node-version:
        description: Node.js version. Ignored when node-version-file is set.
        type: string
        default: "22"
      pnpm-version:
        description: pnpm version when package.json has no packageManager field (e.g. "10.20.0").
        type: string
        default: ""
      node-version-file:
        description: File with the Node.js version (.nvmrc, .node-version, package.json), relative to the repo root.
        type: string
        default: ""
      lint-command:
        description: Lint command. "auto" runs `biome ci` when biome.json(c) exists, else the `lint` script if present. "" skips.
        type: string
        default: auto
      typecheck-command:
        description: Typecheck command. "auto" runs the `typecheck` script, else `tsc --noEmit` when tsconfig.json exists. "" skips.
        type: string
        default: auto
      test-command:
        description: Test command. "auto" runs the `test` script when present. "" skips.
        type: string
        default: auto
      require-tests:
        description: With test-command auto, fail (instead of warn) when package.json has no `test` script. Part of the TDD standard.
        type: boolean
        default: false
      coverage-threshold:
        description: >-
          Minimum line coverage in percent, e.g. "80". "" turns the gate off. With test-command auto,
          `vitest run` or `jest` runs with coverage and writes coverage/coverage-summary.json;
          a custom test-command must write that file itself.
        type: string
        default: ""
      build-command:
        description: Optional build command, e.g. "npm run build". "" skips.
        type: string
        default: ""
      postgres:
        description: Start a disposable PostgreSQL and export DATABASE_URL (start-postgres on Railway, the preinstalled server on GitHub-hosted).
        type: boolean
        default: false
      timeout-minutes:
        type: number
        default: 20

permissions:
  contents: read

jobs:
  node:
    name: node (${{ inputs.working-directory }})
    runs-on: ${{ fromJSON(inputs.runner) }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    defaults:
      run:
        shell: bash
        working-directory: ${{ inputs.working-directory }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Detect package manager
        id: pm
        env:
          DIR: ${{ inputs.working-directory }}
        run: |
          if [ -f pnpm-lock.yaml ]; then
            echo "manager=pnpm" >> "$GITHUB_OUTPUT"
            echo "lockfile=pnpm-lock.yaml" >> "$GITHUB_OUTPUT"
          elif [ -f package-lock.json ]; then
            echo "manager=npm" >> "$GITHUB_OUTPUT"
            echo "lockfile=package-lock.json" >> "$GITHUB_OUTPUT"
          else
            echo "::error::No package-lock.json or pnpm-lock.yaml in $DIR; commit a lockfile so installs are reproducible."
            exit 1
          fi

      - name: Set up pnpm
        if: steps.pm.outputs.manager == 'pnpm'
        uses: pnpm/action-setup@d9184bf108216479bc5a137cc391f4d7b14c870b # v6.1.0
        with:
          version: ${{ inputs.pnpm-version }}
          package_json_file: ${{ inputs.working-directory }}/package.json

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ inputs.node-version-file == '' && inputs.node-version || '' }}
          node-version-file: ${{ inputs.node-version-file }}
          cache: ${{ steps.pm.outputs.manager }}
          cache-dependency-path: ${{ inputs.working-directory }}/${{ steps.pm.outputs.lockfile }}

      - name: Install dependencies
        run: |
          if [ "${{ steps.pm.outputs.manager }}" = pnpm ]; then
            pnpm install --frozen-lockfile
          else
            npm ci
          fi

      - name: Start PostgreSQL
        if: inputs.postgres
        working-directory: .
        run: |
          if command -v start-postgres >/dev/null 2>&1; then
            start-postgres   # Railway runner: PostgreSQL 17, trust auth on 127.0.0.1
          else
            # GitHub-hosted Ubuntu ships PostgreSQL stopped; switch it to trust auth for this throwaway VM.
            confs=(/etc/postgresql/*/main/pg_hba.conf); conf="${confs[0]}"
            printf 'local all all trust\nhost all all 127.0.0.1/32 trust\nhost all all ::1/128 trust\n' | sudo tee "$conf" >/dev/null
            sudo systemctl start postgresql.service
            for _ in $(seq 1 30); do pg_isready -h 127.0.0.1 -p 5432 -U postgres >/dev/null 2>&1 && break; sleep 1; done
            pg_isready -h 127.0.0.1 -p 5432 -U postgres
          fi
          # The Railway runner (and its PostgreSQL) persists between jobs: give every job a fresh
          # database and drop leftovers from cancelled runs. A repo-scoped runner runs one job at a time.
          psql=(psql -h 127.0.0.1 -U postgres -d postgres -v ON_ERROR_STOP=1 -qAt)
          for old in $("${psql[@]}" -c "SELECT datname FROM pg_database WHERE datname LIKE 'ci\_%'"); do
            "${psql[@]}" -c "DROP DATABASE IF EXISTS \"$old\" WITH (FORCE)"
          done
          db="ci_${GITHUB_RUN_ID}_${GITHUB_RUN_ATTEMPT}_${RANDOM}"
          "${psql[@]}" -c "CREATE DATABASE \"$db\""
          echo "CI_DATABASE=$db" >> "$GITHUB_ENV"
          echo "DATABASE_URL=postgresql://postgres@127.0.0.1:5432/$db" >> "$GITHUB_ENV"

      - name: Lint
        if: inputs.lint-command != ''
        env:
          CMD: ${{ inputs.lint-command }}
          PM: ${{ steps.pm.outputs.manager }}
        run: |
          if [ "$CMD" != auto ]; then eval "$CMD"; exit; fi
          if [ -f biome.json ] || [ -f biome.jsonc ]; then
            "$PM" exec biome ci .
          elif node -e 'process.exit(require("./package.json").scripts?.lint ? 0 : 1)'; then
            "$PM" run lint
          else
            echo "::warning::No Biome config or lint script; lint skipped."
          fi

      - name: Typecheck
        if: inputs.typecheck-command != ''
        env:
          CMD: ${{ inputs.typecheck-command }}
          PM: ${{ steps.pm.outputs.manager }}
        run: |
          if [ "$CMD" != auto ]; then eval "$CMD"; exit; fi
          if node -e 'process.exit(require("./package.json").scripts?.typecheck ? 0 : 1)'; then
            "$PM" run typecheck
          elif [ -f tsconfig.json ]; then
            # npm needs `--`, or it reads --noEmit as its own config flag and drops it.
            # --no: never download the unrelated `tsc` package when typescript is not installed.
            if [ "$PM" = npm ]; then npm exec --no -- tsc --noEmit; else pnpm exec tsc --noEmit; fi
          else
            echo "No typecheck script or tsconfig.json; typecheck skipped."
          fi

      - name: Test
        if: inputs.test-command != ''
        env:
          CMD: ${{ inputs.test-command }}
          PM: ${{ steps.pm.outputs.manager }}
          REQUIRE_TESTS: ${{ inputs.require-tests }}
          THRESHOLD: ${{ inputs.coverage-threshold }}
        run: |
          # A committed or stale summary must not satisfy the gate.
          if [ -n "$THRESHOLD" ]; then rm -rf coverage; fi
          if [ "$CMD" != auto ]; then eval "$CMD"; exit; fi
          run_bin() { if [ "$PM" = npm ]; then npm exec -- "$@"; else pnpm exec "$@"; fi; }  # npm eats flags without `--`
          has_dep() { node -e 'const p=require("./package.json"); process.exit({...p.dependencies, ...p.devDependencies}[process.argv[1]] ? 0 : 1)' "$1"; }
          if [ -n "$THRESHOLD" ]; then
            # Coverage needs a known runner: call it directly rather than through the `test` script.
            if has_dep vitest; then
              run_bin vitest run --coverage.enabled=true --coverage.reporter=text \
                --coverage.reporter=json-summary --coverage.reportsDirectory=coverage
            elif has_dep jest; then
              run_bin jest --coverage --coverageReporters=text --coverageReporters=json-summary --coverageDirectory=coverage
            else
              echo "::error::coverage-threshold needs vitest or jest in package.json, or a custom test-command that writes coverage/coverage-summary.json."
              exit 1
            fi
          elif node -e 'process.exit(require("./package.json").scripts?.test ? 0 : 1)'; then
            "$PM" run test
          elif [ "$REQUIRE_TESTS" = true ]; then
            echo "::error::require-tests is on but package.json has no test script."
            exit 1
          else
            echo "::warning::No test script; tests skipped."
          fi

      - name: Coverage gate
        if: inputs.coverage-threshold != ''
        env:
          THRESHOLD: ${{ inputs.coverage-threshold }}
        run: |
          if ! [[ "$THRESHOLD" =~ ^[0-9]+([.][0-9]+)?$ ]] || ! awk -v t="$THRESHOLD" 'BEGIN { exit !(t <= 100) }'; then
            echo "::error::coverage-threshold must be a number from 0 to 100, got \"$THRESHOLD\"."
            exit 1
          fi
          node - <<'EOF'
          const fs = require("fs");
          const file = "coverage/coverage-summary.json";
          const threshold = Number(process.env.THRESHOLD);
          if (!fs.existsSync(file)) {
            console.log(`::error::${file} not found. Tests must run with a json-summary coverage reporter.`);
            process.exit(1);
          }
          const { total } = JSON.parse(fs.readFileSync(file, "utf8"));
          if (!total.lines.total) {
            console.log("::error::Coverage measured no lines; check the coverage include/exclude settings.");
            process.exit(1);
          }
          const rows = ["lines", "statements", "functions", "branches"]
            .map((k) => `| ${k} | ${total[k].covered}/${total[k].total} | ${total[k].pct}% |`);
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY,
            `### Coverage (gate: lines >= ${threshold}%)\n\n| Metric | Covered | % |\n|---|---|---|\n${rows.join("\n")}\n\n`);
          if (total.lines.pct < threshold) {
            console.log(`::error::Line coverage ${total.lines.pct}% is below the ${threshold}% threshold.`);
            process.exit(1);
          }
          console.log(`Line coverage ${total.lines.pct}% meets the ${threshold}% threshold.`);
          if (total.lines.pct >= threshold + 2) {
            console.log(`::notice::Line coverage ${total.lines.pct}% is 2+ points above the threshold; raise coverage-threshold to ${Math.floor(total.lines.pct)} (ratchet).`);
          }
          EOF

      - name: Build
        if: inputs.build-command != ''
        env:
          CMD: ${{ inputs.build-command }}
        run: eval "$CMD"

      - name: Drop CI database
        if: always() && inputs.postgres && env.CI_DATABASE != ''
        working-directory: .
        run: psql -h 127.0.0.1 -U postgres -d postgres -qAt -c "DROP DATABASE IF EXISTS \"$CI_DATABASE\" WITH (FORCE)" || true
