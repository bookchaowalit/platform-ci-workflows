# CI for this repository: lint the workflows, then run the security scan on itself.
name: self-test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: self-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  actionlint:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      # renovate: datasource=github-releases depName=rhysd/actionlint
      ACTIONLINT_VERSION: "1.7.12"
      ACTIONLINT_SHA256: "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8"  # actionlint_1.7.12_linux_amd64.tar.gz
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install actionlint ${{ env.ACTIONLINT_VERSION }}
        run: |
          f="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -fsSL -o "$RUNNER_TEMP/$f" "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/$f"
          echo "$ACTIONLINT_SHA256  $RUNNER_TEMP/$f" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$f" -C "$RUNNER_TEMP" actionlint
      - name: actionlint (with shellcheck)
        run: '"$RUNNER_TEMP/actionlint" -color'
      - name: shellcheck scripts
        run: shellcheck scripts/*.sh

  python-postgres:
    # Exercises ci-python + postgres on a GitHub-hosted runner (the pilots cover Railway).
    uses: ./.github/workflows/ci-python.yml
    with:
      working-directory: tests/fixtures/python
      install-command: ""
      typecheck-command: ""
      test-command: python check_db.py
      postgres: true

  gate-tests:
    # Failure paths of the coverage gate and require-tests, which the reusable-workflow jobs
    # below cannot show (a called workflow cannot be expected to fail): tests/gates_test.py.
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      # renovate: datasource=pypi depName=uv
      UV_VERSION: "0.13.1"
      # renovate: datasource=pypi depName=pyyaml
      PYYAML_VERSION: "6.0.3"
      # renovate: datasource=pypi depName=coverage
      COVERAGE_VERSION: "7.16.2"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: ${{ env.UV_VERSION }}
          python-version: "3.13"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - name: Gate script tests
        run: uv run --no-project --with "pyyaml==$PYYAML_VERSION" --with "coverage==$COVERAGE_VERSION" python tests/gates_test.py

  node-coverage:
    # Exercises ci-node with require-tests and the coverage gate (npm + Vitest).
    uses: ./.github/workflows/ci-node.yml
    with:
      working-directory: tests/fixtures/node-coverage
      lint-command: ""
      typecheck-command: ""
      require-tests: true
      coverage-threshold: "80"

  python-coverage:
    # Exercises ci-python's coverage gate (pytest-cov installed by the workflow).
    uses: ./.github/workflows/ci-python.yml
    with:
      working-directory: tests/fixtures/python-coverage
      install-command: uv pip install pytest
      typecheck-command: ""
      coverage-threshold: "80"

  security:
    uses: ./.github/workflows/security.yml
